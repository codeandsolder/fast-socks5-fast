name: CI

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@169c8823c1bb0f5e5645ad813b441d605d49d5bb # main
    with:
      command: ":"
      strict-suites: >-
        ${{ !startsWith(github.ref, 'refs/tags/') && '[{"name":"all-features","cargo":["--locked","--all-targets","--all-features"],"allow-test-panics":true}]' || '' }}
      test-suites: |
        [{"name":"all-features","cargo":["--locked","--all-features"],"doctests":["--locked","--all-features"]}]
