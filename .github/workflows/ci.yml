name: CI

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Rust 1.99.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject allow attributes
        shell: bash
        run: |
          if git grep -n -E '(^|[^[:alnum:]_])allow[[:space:]]*\(' -- '*.rs'; then
            echo 'allow(...) attributes are forbidden in Rust sources; use a narrow reasoned expect(...)' >&2
            exit 1
          fi
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt,clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Strict default library
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test default library and integration tests
        run: cargo test --locked --lib --tests
      - name: Compile every target and optional protocol
        run: cargo check --locked --all-features --all-targets
