name: CI

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  stable:
    name: Rust 1.99.1 Linux checks and tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@be66a1ada16209be5b75d39724ef7383892d92cc # main
    with:
      runner: ubuntu-24.04
      rust-toolchain: "1.99.1"
      rust-components: "rustfmt clippy"
      command: |
        set -euo pipefail
        if git grep -n -E '(^|[^[:alnum:]_])allow[[:space:]]*\(' -- '*.rs'; then
          echo 'allow(...) attributes are forbidden in Rust sources; use a narrow reasoned expect(...)' >&2
          exit 1
        fi
        cargo +1.99.1 fmt --all --check
        cargo +1.99.1 clippy --locked --all-targets --all-features -- -D warnings
        cargo +1.99.1 test --locked --lib --tests
        cargo +1.99.1 check --locked --all-features --all-targets
