name: Strict Rust

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@9c068415babe9decd3fc2f6e2c0481fd5e5ee134
    with:
      cargo-args: --locked --lib
      allow-test-panics: true
      ban-python-outside-ci: true
