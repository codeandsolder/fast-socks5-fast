name: Strict Rust

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@9449a52f9cfe2a4dfe511138e2fb688459314a9b
    with:
      cargo-args: --locked --lib
      allow-test-panics: true
