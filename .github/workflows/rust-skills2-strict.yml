    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@ca8e5368b41e5699095dd0458a3849ecb8db7712
    with:
      cargo-args: --locked --lib
      allow-test-panics: true
