name: Strict Rust

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@260a48d4b1cf65252f892b067fe41f44f05e653a # main
    with:
      cargo-args: --locked --lib
      allow-test-panics: true
      ban-python-outside-ci: true
